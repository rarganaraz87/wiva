<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiva - Art Exhibition</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>Wiva - Art Exhibition</h1>
</header>

<nav>
  <button onclick="show('form')">Create</button>
  <button onclick="show('requests')">Requests</button>
  <button onclick="show('dashboard')">Dashboard</button>
</nav>

<!-- FORM -->
<section id="form" class="page">

  <!-- ARTIST -->
  <div class="card blue">
    <h2 class="section-title">Artist Information</h2>

    <label>Artist Name</label>
    <input id="artistName" placeholder="e.g. Pablo Picasso">

    <label>Address</label>
    <input id="artistAddress" placeholder="e.g. 123 London Street">

    <!-- ROW EMAIL + MOBILE -->
    <div class="row">

      <div>
        <label>Email</label>
        <input id="artistEmail" type="email" placeholder="e.g. artist@email.com">
      </div>

      <div>
        <label>Mobile Number</label>
        <input id="artistMobile" placeholder="e.g. +44 7123 456789">
      </div>

    </div>

    <label>Social Media</label>
    <input id="artistSocial" placeholder="e.g. Instagram / Website">
  </div>

  <!-- ARTWORK -->
  <div class="card purple">
    <h2 class="section-title">Artwork Details</h2>

    <label>Artwork Title</label>
    <input id="title" placeholder="e.g. Blue Horizon">

    <label>Description</label>
    <input id="desc" placeholder="e.g. Abstract painting">

    <label>For Sale</label>
    <select id="sale" onchange="togglePrice()">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <label id="priceLabel">Price (£)</label>
    <input id="price" type="number" placeholder="e.g. 800">

    <button class="btn add-btn" onclick="addArtwork()">
      Add Artwork
    </button>
  </div>

  <!-- LIST -->
  <div class="card green">
    <h3>Artwork List</h3>

    <table class="table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>
          <th>For Sale</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="tempTable"></tbody>
    </table>
  </div>

  <!-- SAVE -->
  <div class="card blue">
    <button class="btn save" onclick="saveArtist()">
      Save & Finish
    </button>
  </div>

</section>

<!-- REQUESTS -->
<section id="requests" class="page hidden">

  <div class="card blue">
    <h2>Requests</h2>

    <button class="btn" onclick="exportCSV()">Export CSV</button>

    <table class="table">
      <thead>
        <tr>
          <th>Artist</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>Title</th>
          <th>Description</th>
          <th>For Sale</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="requestTable"></tbody>
    </table>
  </div>

</section>

<!-- DASHBOARD -->
<section id="dashboard" class="page hidden">

  <div class="grid">

    <div class="card blue stat">
      <h3>Artists</h3>
      <h2 id="totalArtists">0</h2>
    </div>

    <div class="card purple stat">
      <h3>Artworks</h3>
      <h2 id="totalArtworks">0</h2>
    </div>

    <div class="card green stat">
      <h3>For Sale</h3>
      <h2 id="totalSale">0</h2>
    </div>

  </div>

</section>

<footer>
  <p>© Wiva - Art Exhibition</p>
</footer>

<script src="app.js"></script>
</body>
</html>
